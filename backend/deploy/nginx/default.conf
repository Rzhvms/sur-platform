# Request bodies, query strings and credential headers are excluded from access logs.
log_format sur_access '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

# Empty values do not add a header to API responses, preserving their cache/error contracts.
map $uri $sur_static_cache {
    default "no-cache";
    ~*^/(?:api|health|swagger)(?:/|$) "";
}
map $uri $sur_spa_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'";
    ~*^/(?:api|health|swagger)(?:/|$) "";
}

map "$ssl_server_name:$host:$http_host" $sur_client_host {
    default "";
    ~*^alpha\.sur\.test:alpha\.sur\.test:alpha\.sur\.test(:443)?$ alpha.sur.test;
    ~*^beta\.sur\.test:beta\.sur\.test:beta\.sur\.test(:443)?$ beta.sur.test;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    server_name alpha.sur.test beta.sur.test;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    if ($sur_client_host = "") {
        return 421;
    }

    location ~* ^/api/v[^/]+/internal(?:/|$) {
        return 404;
    }

    client_max_body_size 8m;
    server_tokens off;
    access_log /var/log/nginx/access.log sur_access;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $sur_static_cache always;
    add_header Content-Security-Policy $sur_spa_csp always;

    location ~* ^/(?:api|health|swagger)(?:/|$) {
        # Keep raw document uploads buffered before forwarding them to Kestrel.
        proxy_request_buffering on;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $sur_client_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }

    root /usr/share/nginx/html/sur;
    index index.html;

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|ico|woff2)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
