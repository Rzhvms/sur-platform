map "$ssl_server_name:$host:$http_host" $sur_client_host {
    default "";
    ~*^alpha\.sur\.test:alpha\.sur\.test:alpha\.sur\.test(:443)?$ alpha.sur.test;
    ~*^beta\.sur\.test:beta\.sur\.test:beta\.sur\.test(:443)?$ beta.sur.test;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    server_name alpha.sur.test beta.sur.test;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    if ($sur_client_host = "") {
        return 421;
    }

    location ~* ^/api/v[^/]+/internal(?:/|$) {
        return 404;
    }

    client_max_body_size 8m;

    location ~* ^/(?:api|health|swagger)(?:/|$) {
        # Keep raw document uploads buffered before forwarding them to Kestrel.
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
        proxy_set_header Host $sur_client_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }

    root /usr/share/nginx/html/sur;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|ico|woff2)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
