map "$ssl_server_name:$host:$http_host" $sur_client_host {
    default "";
    ~*^alpha\.sur\.test:alpha\.sur\.test:alpha\.sur\.test(:443)?$ alpha.sur.test;
    ~*^beta\.sur\.test:beta\.sur\.test:beta\.sur\.test(:443)?$ beta.sur.test;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    server_name alpha.sur.test beta.sur.test;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    if ($sur_client_host = "") {
        return 421;
    }

    location ~* ^/api/v[^/]+/internal(?:/|$) {
        return 404;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $sur_client_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }
}
