services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${SUR_POSTGRES_PASSWORD:?set SUR_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [database]
  backend:
    build:
      context: .
      dockerfile: Apps/SurPlatform/Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Operations__PauseOutbound: ${SUR_PAUSE_OUTBOUND:-false}
      Documents__Minio__Endpoint: ${SUR_MINIO_ENDPOINT:-minio:9000}
      Documents__Minio__Bucket: ${SUR_MINIO_BUCKET:-sur-documents}
      Documents__Minio__UseTls: ${SUR_MINIO_TLS:-false}
      Documents__Minio__AccessKey: ${SUR_MINIO_ACCESS_KEY:-}
      Documents__Minio__SecretKey: ${SUR_MINIO_SECRET_KEY:-}
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: ${SUR_ENVIRONMENT:-Production}
      Http__KnownProxy: 172.29.128.2
      JwtKeys__DirectoryPath: /var/lib/sur/keys
      Identity__DataProtectionDirectory: /var/lib/sur/data-protection
      Identity__Smtp__Host: ${SUR_SMTP_HOST:-}
      Identity__Smtp__Port: ${SUR_SMTP_PORT:-587}
      Identity__Smtp__From: ${SUR_SMTP_FROM:-}
      Identity__Smtp__Username: ${SUR_SMTP_USERNAME:-}
      Identity__Smtp__Password: ${SUR_SMTP_PASSWORD:-}
      Clients__0__FirstAdministrator__Email: ${SUR_ALPHA_ADMIN_EMAIL:-}
      Clients__0__FirstAdministrator__FullName: ${SUR_ALPHA_ADMIN_NAME:-}
      Clients__1__FirstAdministrator__Email: ${SUR_BETA_ADMIN_EMAIL:-}
      Clients__1__FirstAdministrator__FullName: ${SUR_BETA_ADMIN_NAME:-}
      Clients__0__Host: alpha.sur.test
      Clients__0__ConnectionString: Host=postgres;Database=sur_alpha;Username=sur_alpha;Password="${SUR_ALPHA_PASSWORD:?set SUR_ALPHA_PASSWORD}"
      Clients__0__BootstrapConnectionString: Host=postgres;Database=postgres;Username=sur_bootstrap;Password="${SUR_BOOTSTRAP_PASSWORD:?set SUR_BOOTSTRAP_PASSWORD}"
      Clients__1__Host: beta.sur.test
      Clients__1__ConnectionString: Host=postgres;Database=sur_beta;Username=sur_beta;Password="${SUR_BETA_PASSWORD:?set SUR_BETA_PASSWORD}"
      Clients__1__BootstrapConnectionString: Host=postgres;Database=postgres;Username=sur_bootstrap;Password="${SUR_BOOTSTRAP_PASSWORD:?set SUR_BOOTSTRAP_PASSWORD}"
    volumes:
      - jwt-keys:/var/lib/sur/keys
      - data-protection:/var/lib/sur/data-protection
    networks: [proxy, database, storage]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [documents]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SUR_MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${SUR_MINIO_SECRET_KEY:-}
    volumes:
      - minio-data:/data
    networks: [storage]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [documents]
    depends_on: [minio]
    environment:
      ACCESS_KEY: ${SUR_MINIO_ACCESS_KEY:-}
      SECRET_KEY: ${SUR_MINIO_SECRET_KEY:-}
      BUCKET: ${SUR_MINIO_BUCKET:-sur-documents}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set sur http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY" && mc mb --ignore-existing "sur/$$BUCKET"; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    networks: [storage]
  nginx:
    image: nginx:alpine
    depends_on: [backend]
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SUR_TLS_DIR:?set SUR_TLS_DIR}:/etc/nginx/tls:ro
    networks:
      proxy:
        ipv4_address: 172.29.128.2

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.29.128.0/28
  database:
    internal: true
  storage:
    internal: true

volumes:
  postgres-data:
  jwt-keys:
  data-protection:
  minio-data:
