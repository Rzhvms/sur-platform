<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СУР · Концепции знака</title>
<style>
  * { box-sizing: border-box; }
  body { background: #fafafa; color: #171717; font: 15px/1.5 Geist, Arial, sans-serif; padding: clamp(16px, 4vw, 48px); margin: 0; }
  main { max-width: 1120px; margin: auto; }
  h1 { font-size: clamp(26px, 4vw, 42px); letter-spacing: -.045em; margin: 0 0 6px; line-height: 1.15; }
  p { color: #616161; margin: 0 0 18px; }
  .concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; margin-top: 24px; }
  article { padding: 18px; border: 1px solid #e5e5e5; border-radius: 12px; background: white; }
  article h2 { font-size: 18px; margin: 12px 0 3px; }
  article p { min-height: 45px; }
  .mark { background: #f5f5f5; min-height: 125px; display: grid; place-items: center; border-radius: 8px; }
  header { display: flex; align-items: center; gap: 9px; border: 1px solid #e5e5e5; padding: 7px; border-radius: 6px; font-weight: 600; }
  header span { margin-left: auto; color: #616161; font-size: 12px; }
  .sizes { display: flex; align-items: center; gap: 18px; margin-top: 14px; font-size: 12px; }
  .sizes span { display: flex; align-items: center; gap: 5px; }
</style>
<main>
  <h1>Концепции знака СУР</h1>
  <p>Система управления рисками</p>
  <section class="concepts">
    <article>
      <div class="mark"><img src="contour.svg" width="76" height="76" alt=""></div>
      <h2>Контур</h2><p>Вложенные границы рабочих процессов.</p>
      <header><img src="contour.svg" width="24" height="24" alt=""><strong>СУР</strong><span>Риски</span></header>
      <div class="sizes"><span><img src="contour.svg" width="16" height="16" alt="">16 px</span><span><img src="contour.svg" width="32" height="32" alt="">32 px</span></div>
    </article>
    <article>
      <div class="mark"><img src="register.svg" width="76" height="76" alt=""></div>
      <h2>Реестр</h2><p>Упорядоченные строки рабочего списка.</p>
      <header><img src="register.svg" width="24" height="24" alt=""><strong>СУР</strong><span>Риски</span></header>
      <div class="sizes"><span><img src="register.svg" width="16" height="16" alt="">16 px</span><span><img src="register.svg" width="32" height="32" alt="">32 px</span></div>
    </article>
    <article>
      <div class="mark"><img src="coordinates.svg" width="76" height="76" alt=""></div>
      <h2>Координаты</h2><p>Ячейки оценки с одной выделенной областью.</p>
      <header><img src="coordinates.svg" width="24" height="24" alt=""><strong>СУР</strong><span>Риски</span></header>
      <div class="sizes"><span><img src="coordinates.svg" width="16" height="16" alt="">16 px</span><span><img src="coordinates.svg" width="32" height="32" alt="">32 px</span></div>
    </article>
  </section>
</main>
</html>
